<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>小一英文拼字遊戲 (面試生字版)</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --primary: #FF9AA2;
      --secondary: #FFDAC1;
      --accent1: #E2F0CB;
      --accent2: #B5EAD7;
      --accent3: #C7CEEA;
      --text-dark: #334155;
      --correct: #4ade80;
      --wrong: #f87171;
    }

    * { box-sizing: border-box; font-family: 'Comic Sans MS', -apple-system, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent;}
    
    body {
      background-color: var(--bg-color);
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      color: var(--text-dark);
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      background: white;
      border-radius: 30px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      padding: 25px;
      position: relative;
      max-height: 96vh;
      overflow-y: auto;
    }

    /* 首頁選單 */
    #home-screen { display: block; text-align: center; }
    #home-screen h1 { font-size: 34px; color: #ff6b6b; margin-bottom: 10px; }
    #home-screen p { font-size: 18px; color: #888; margin-bottom: 30px; }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .cat-btn {
      background-color: var(--secondary); border: none; border-radius: 20px;
      padding: 15px; font-size: 18px; font-weight: bold; color: var(--text-dark);
      cursor: pointer; box-shadow: 0 6px 0px rgba(0,0,0,0.1); transition: transform 0.1s;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .cat-btn:active { transform: translateY(6px); box-shadow: none; }
    .cat-btn span { font-size: 40px; }

    /* 綜合大測驗 */
    .mix-btn {
      grid-column: 1 / -1; 
      background: linear-gradient(135deg, #FFD700, #FFA500) !important;
      color: white !important;
      flex-direction: row; 
      justify-content: center;
      padding: 20px;
      font-size: 24px;
      box-shadow: 0 8px 15px rgba(255, 165, 0, 0.3);
    }
    .mix-btn span { font-size: 45px; margin-right: 15px; }

    .cat-btn:not(.mix-btn):nth-child(4n+2) { background-color: var(--primary); color: white;}
    .cat-btn:not(.mix-btn):nth-child(4n+3) { background-color: var(--accent2); }
    .cat-btn:not(.mix-btn):nth-child(4n+4) { background-color: var(--secondary); }
    .cat-btn:not(.mix-btn):nth-child(4n+1) { background-color: var(--accent3); color: white;}

    /* 遊戲畫面 */
    #game-screen { display: none; text-align: center; height: 100%; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .back-btn { background: #eee; border: none; padding: 12px 25px; border-radius: 20px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    .score-board { font-size: 20px; font-weight: bold; color: #ff9800; background: #fff3e0; padding: 10px 20px; border-radius: 20px; }
    
    .question-box { margin: 10px 0 30px 0; display: flex; flex-direction: column; align-items: center; }
    .q-emoji { font-size: 90px; line-height: 1.2; margin-bottom: 5px; }
    .q-zh { font-size: 24px; color: #64748b; font-weight: bold; margin-bottom: 15px; }
    .audio-btn {
      background: var(--accent1); border: none; border-radius: 50%; width: 50px; height: 50px;
      font-size: 24px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px;
    }
    .audio-btn:active { transform: scale(0.9); }

    /* 拼字區域 (上方空格) */
    .slots-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 30px;
      min-height: 60px;
    }
    
    .letter-slot {
      width: 50px;
      height: 60px;
      border-bottom: 5px solid #cbd5e1;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 34px;
      font-weight: 900;
      color: var(--accent3);
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .letter-slot.filled {
      border-bottom-color: var(--accent3);
      background: rgba(199, 206, 234, 0.1);
      border-radius: 8px 8px 0 0;
    }

    /* 選擇區域 (下方字母) */
    .letters-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      max-width: 600px;
      margin: 0 auto;
    }

    .letter-btn {
      width: 55px;
      height: 65px;
      background: white;
      border: 3px solid var(--accent2);
      border-radius: 12px;
      font-size: 32px;
      font-weight: 900;
      color: var(--text-dark);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 5px 0px var(--accent2);
      text-transform: uppercase;
      transition: all 0.1s;
    }
    
    .letter-btn:active { transform: translateY(5px); box-shadow: none; }
    .letter-btn.used { visibility: hidden; }

    /* 動畫效果 */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    .shake { animation: shake 0.4s ease-in-out; }
    
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); color: var(--correct); }
      100% { transform: scale(1); }
    }
    .pop { animation: pop 0.5s ease; border-bottom-color: var(--correct) !important; color: var(--correct) !important; }

  </style>
</head>

      {en: "helicopter", zh: "直升機", em: "🚁"}, {en: "lorry", zh: "卡車", em: "🚛"}, {en: "motorbike", zh: "摩托車", em: "🏍️"},
      {en: "plane", zh: "飛機", em: "✈️"}, {en: "ship", zh: "輪船", em: "🚢"}, {en: "swim", zh: "游泳", em: "🏊"},
      {en: "train", zh: "火車", em: "🚆"}, {en: "truck", zh: "卡車", em: "🚚"}, {en: "ride", zh: "搭乘", em: "🚴"},

      {en: "day", zh: "一天", em: "☀️"}, {en: "evening", zh: "傍晚", em: "🌆"}, {en: "today", zh: "今天", em: "📅"},
      {en: "in", zh: "在", em: "⏳"}, {en: "watch", zh: "手表", em: "⌚"}, {en: "morning", zh: "早晨", em: "🌅"},
      {en: "year", zh: "年", em: "🗓️"}, {en: "night", zh: "夜晚", em: "🌙"}
    ]},
    world: { name: "The World (環境)", emoji: "🌍", words: [
      {en: "beach", zh: "海灘", em: "🏖️"}, {en: "sand", zh: "沙子", em: "🏜️"}, {en: "sea", zh: "海洋", em: "🌊"},
      {en: "shell", zh: "貝殼", em: "🐚"}, {en: "street", zh: "街道", em: "🛣️"}, {en: "sun", zh: "太陽", em: "☀️"},
      {en: "tree", zh: "樹", em: "🌳"}, {en: "water", zh: "水", em: "💧"}, {en: "paper", zh: "紙", em: "📄"}, {en: "teacher", zh: "教師", em: "👩‍🏫"}
    ]}
  };

  let currentCategory = "";
  let remainingQuizWords = [];
  let currentWordObj = null;
  let score = 0;
  
  let answerSlots = [];
  let availableLetters = []; 

  function initMenu() {
    const grid = document.getElementById("cat-grid");
    grid.innerHTML = "";
    
    // 綜合大測驗按鈕
    const mixBtn = document.createElement("button");
    mixBtn.className = "cat-btn mix-btn";
    mixBtn.innerHTML = `<span>🏆</span> 綜合大測驗 (全部主題)`;
    mixBtn.onclick = () => startGame("all");
    grid.appendChild(mixBtn);

    // 單一主題按鈕
    for (let key in db) {
      const btn = document.createElement("button");
      btn.className = "cat-btn";
      btn.innerHTML = `<span>${db[key].emoji}</span><span>${db[key].name}</span>`;
      btn.onclick = () => startGame(key);
      grid.appendChild(btn);
    }
  }

  function goHome() {
    document.getElementById("home-screen").style.display = "block";
    document.getElementById("game-screen").style.display = "none";
    window.speechSynthesis.cancel();
  }

  function startGame(category) {
    currentCategory = category;
    score = 0;
    document.getElementById("score").innerText = score;
    document.getElementById("home-screen").style.display = "none";
    document.getElementById("game-screen").style.display = "block";
    
    if (category === "all") {
      let allWords = [];
      for (let key in db) { allWords = allWords.concat(db[key].words); }
      remainingQuizWords = allWords.sort(() => Math.random() - 0.5).slice(0, 20); 
    } else {
      remainingQuizWords = [...db[category].words].sort(() => Math.random() - 0.5);
    }

    nextQuestion();
  }

  function nextQuestion() {
    if (remainingQuizWords.length === 0) {
      setTimeout(() => {
        alert(`🎉 恭喜你完成測驗！\n⭐ 你的總得分是：${score} 分！`);
        goHome();
      }, 500);
      return;
    }

    currentWordObj = remainingQuizWords.pop();
    
    // 忽略字詞中嘅空格，例如 "ice cream" 變 "icecream"
    const wordStr = currentWordObj.en.replace(/\s+/g, '').toUpperCase();
    
    document.getElementById("q-emoji").innerText = currentWordObj.em;
    document.getElementById("q-zh").innerText = currentWordObj.zh;
    
    answerSlots = new Array(wordStr.length).fill(null);
    
    let lettersArray = wordStr.split('');
    
    // 加入 2 個隨機干擾字母，增加少少難度
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    lettersArray.push(alphabet[Math.floor(Math.random() * 26)]);
    lettersArray.push(alphabet[Math.floor(Math.random() * 26)]);
    
    lettersArray.sort(() => Math.random() - 0.5);
    
    availableLetters = lettersArray.map((char, index) => ({
      id: index,
      char: char,
      used: false
    }));

    renderGameArea();
    
    setTimeout(playAudio, 400);
  }

  function renderGameArea() {
    const slotsArea = document.getElementById("slots-area");
    const lettersArea = document.getElementById("letters-area");
    
    slotsArea.innerHTML = "";
    answerSlots.forEach((slotData, index) => {
      const slotDiv = document.createElement("div");
      slotDiv.className = "letter-slot";
      if (slotData) {
        slotDiv.innerText = slotData.char;
        slotDiv.classList.add("filled");
        slotDiv.onclick = () => returnLetter(index);
      }
      slotsArea.appendChild(slotDiv);
    });

    lettersArea.innerHTML = "";
    availableLetters.forEach((letterData) => {
      const btn = document.createElement("button");
      btn.className = "letter-btn";
      btn.innerText = letterData.char;
      if (letterData.used) {
        btn.classList.add("used");
      } else {
        btn.onclick = () => selectLetter(letterData.id);
      }
      lettersArea.appendChild(btn);
    });
  }

  function selectLetter(letterId) {
    const emptySlotIndex = answerSlots.findIndex(slot => slot === null);
    if (emptySlotIndex === -1) return;

    const letterIndex = availableLetters.findIndex(l => l.id === letterId);
    
    answerSlots[emptySlotIndex] = availableLetters[letterIndex];
    availableLetters[letterIndex].used = true;
    
    playTone(400, 'square', 0.05);
    renderGameArea();
    checkAnswer();
  }

  function returnLetter(slotIndex) {
    if (!answerSlots[slotIndex]) return;
    
    const letterId = answerSlots[slotIndex].id;
    const letterIndex = availableLetters.findIndex(l => l.id === letterId);
    
    availableLetters[letterIndex].used = false;
    answerSlots[slotIndex] = null;
    
    playTone(300, 'square', 0.05);
    renderGameArea();
  }

  function checkAnswer() {
    if (answerSlots.includes(null)) return;

    const currentSpelling = answerSlots.map(slot => slot.char).join('');
    const correctSpelling = currentWordObj.en.replace(/\s+/g, '').toUpperCase();

    if (currentSpelling === correctSpelling) {
      score += 10;
      document.getElementById("score").innerText = score;
      
      const slots = document.querySelectorAll(".letter-slot");
      slots.forEach(slot => slot.classList.add("pop"));
      
      playTone(600, "sine", 0.1);
      setTimeout(() => playTone(800, "sine", 0.15), 100);
      
      setTimeout(nextQuestion, 1500);
    } else {
      playTone(200, "sawtooth", 0.3);
      
      const slotsArea = document.getElementById("slots-area");
      slotsArea.classList.add("shake");
      
      setTimeout(() => {
        slotsArea.classList.remove("shake");
        answerSlots.forEach((slotData, index) => {
           if(slotData) returnLetter(index);
        });
      }, 500);
    }
  }

  function playAudio() {
    if (!currentWordObj) return;
    window.speechSynthesis.cancel(); 
    const utterance = new SpeechSynthesisUtterance(currentWordObj.en);
    utterance.lang = 'en-US'; 
    utterance.rate = 0.85; 
    utterance.pitch = 1.1; 
    window.speechSynthesis.speak(utterance);
  }

  function playTone(frequency, type, duration) {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    
    oscillator.type = type;
    oscillator.frequency.value = frequency;
    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    oscillator.start();
    gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
    oscillator.stop(audioCtx.currentTime + duration);
  }

  initMenu();

</script>
